
name: CI build

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (leave empty to build the branch selected in "Use workflow from")'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build artifacts and deploy preview
    if: "!startsWith(github.event.head_commit.message, '[SKIP CI]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          path: master
          fetch-depth: 0

      - name: Set up NodeJs
        uses: actions/setup-node@v4
        with:
          node-version-file: './master/package.json'

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.1.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('master/**/pnpm-lock.yaml') }}

      - name: Build webUI
        working-directory: master
        run: |
          pnpm ci
          pnpm build
          pnpm build-zip
          pnpm build-md5
          ls buildZip

      - name: Generate Tag Name
        id: GenTagName
        working-directory: master
        run: |
          genTag="r$(git rev-list HEAD --count)"
          echo "$genTag"
          echo "value=$genTag" >> "$GITHUB_OUTPUT"

      - name: Create Tag
        working-directory: master
        env:
          TAG: ${{ steps.GenTagName.outputs.value }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Upload CI Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          artifacts: "master/buildZip/*"
          tag: ${{ steps.GenTagName.outputs.value }}
          name: ${{ steps.GenTagName.outputs.value }}
          allowUpdates: true
          replacesArtifacts: true

      - name: Upload WebUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webui-preview
          path: master/buildZip/*
          if-no-files-found: error

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: gh-pages
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Deploy GitHub Pages
        working-directory: gh-pages
        env:
          TAG: ${{ steps.GenTagName.outputs.value }}
        run: |
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf . || true
          git clean -fdx

          cp -r ../master/build/. .
          cp index.html 404.html

          git add -A
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if ! git diff --cached --quiet; then
            git commit -m "$TAG"
            git push origin gh-pages
          else
            echo "No changes to deploy."
          fi
